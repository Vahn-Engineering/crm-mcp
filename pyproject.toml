[project]
name = "vahn-mcp-server"
version = "0.1.0"
description = "VAHN Sales Monitoring MCP Server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.scripts]
vahn-mcp = "vahn_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vahn_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
